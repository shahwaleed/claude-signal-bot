name: Claude Signal Bot

# SCHEDULING NOTE: this workflow has no `on: schedule` trigger — it is fired
# externally by a cron-job.org job calling the workflow_dispatch API (GitHub's
# built-in scheduled cron is unreliable and can drop runs under load).
#
# That cron-job.org job is intentionally set to run at :05 and :35 past the
# hour (NOT :00/:30), a deliberate 5-minute offset from the Market Analyzer's
# schedule (02:00, 06:30, 11:30, 19:00 UTC, i.e. always on a :00/:30 mark).
# Without this offset, both workflows fire at the exact same instant 4x/day,
# and depending on which happens to finish first, the signal bot can read a
# stale config.json before the analyzer has finished writing the new
# strategy decision. Do not "simplify" this back to :00/:30 — the offset is
# the fix for that race condition, not an arbitrary scheduling choice.

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Override strategy (leave empty to use auto-selected from config.json)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - bollinger
          - ema_advanced
          - vwap
          - rsi_divergence
          - breakout
          - ema_basic

# Serialise runs — prevents duplicate signals and race conditions on the trade log.
concurrency:
  group: signal-bot
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: read
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Read strategy from config.json or manual override
        id: strategy
        run: |
          MANUAL="${{ github.event.inputs.strategy }}"
          if [ -n "$MANUAL" ]; then
            echo "strategy=$MANUAL" >> $GITHUB_OUTPUT
            echo "Source: manual override — $MANUAL"
          elif [ -f config.json ]; then
            AUTO=$(python3 -c "import json; print(json.load(open('config.json'))['strategy'])")
            echo "strategy=$AUTO" >> $GITHUB_OUTPUT
            echo "Source: config.json — $AUTO"
          else
            echo "strategy=bollinger" >> $GITHUB_OUTPUT
            echo "Source: default — bollinger"
          fi

      - name: Set artifact and log file names
        id: names
        run: |
          STRATEGY="${{ steps.strategy.outputs.strategy }}"
          # Artifact name uses hyphens (GitHub artifact naming)
          ARTIFACT="trade-log-${STRATEGY//_/-}"
          # Log file name uses underscores (Python filename)
          LOGFILE="trade_log_${STRATEGY}.csv"
          echo "artifact=$ARTIFACT" >> $GITHUB_OUTPUT
          echo "logfile=$LOGFILE" >> $GITHUB_OUTPUT
          echo "Strategy: $STRATEGY | Artifact: $ARTIFACT | Log: $LOGFILE"

      - name: Download previous trade log for this strategy
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: signal_bot.yml
          name: ${{ steps.names.outputs.artifact }}
          path: .
          if_no_artifact_found: ignore
        continue-on-error: true

      - name: Verify selected strategy file is real (not a stub/missing)
        run: |
          STRATEGY="${{ steps.strategy.outputs.strategy }}"
          case "$STRATEGY" in
            bollinger)      FILE="strategy_bollinger.py" ;;
            ema_advanced)   FILE="strategy_ema_advanced.py" ;;
            vwap)           FILE="strategy_vwap.py" ;;
            rsi_divergence) FILE="strategy_rsi_divergence.py" ;;
            breakout)       FILE="strategy_breakout.py" ;;
            *)              FILE="claude_signal_bot.py" ;;
          esac
          # A real strategy file is always well over 1KB; a stub placeholder
          # (e.g. "# see below") is ~11 bytes. 500 bytes is a safe floor that
          # would catch any stub while never false-flagging real code.
          MIN_BYTES=500
          if [ ! -f "$FILE" ]; then
            echo "::error::Strategy file '$FILE' for strategy '$STRATEGY' does not exist. Aborting run instead of silently doing nothing."
            exit 1
          fi
          SIZE=$(wc -c < "$FILE")
          if [ "$SIZE" -lt "$MIN_BYTES" ]; then
            echo "::error::Strategy file '$FILE' for strategy '$STRATEGY' is only $SIZE bytes — looks like a stub/placeholder, not real strategy code. Aborting run instead of silently doing nothing."
            exit 1
          fi
          echo "Strategy file check passed: $FILE ($SIZE bytes)"

      - name: Run selected strategy
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          WEBHOOK_RELAY_URL: ${{ secrets.WEBHOOK_RELAY_URL }}
        run: |
          STRATEGY="${{ steps.strategy.outputs.strategy }}"
          echo "Run STRATEGY=\"$STRATEGY\""
          if [ "$STRATEGY" = "bollinger" ]; then
            python strategy_bollinger.py
          elif [ "$STRATEGY" = "ema_advanced" ]; then
            python strategy_ema_advanced.py
          elif [ "$STRATEGY" = "vwap" ]; then
            python strategy_vwap.py
          elif [ "$STRATEGY" = "rsi_divergence" ]; then
            python strategy_rsi_divergence.py
          elif [ "$STRATEGY" = "breakout" ]; then
            python strategy_breakout.py
          else
            python claude_signal_bot.py
          fi

      - name: Upload updated trade log
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: ${{ steps.names.outputs.logfile }}
          retention-days: 90
          overwrite: true
