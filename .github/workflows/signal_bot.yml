name: Claude Signal Bot

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Override strategy (leave empty to use auto-selected from config.json)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - bollinger
          - ema_advanced
          - vwap
          - rsi_divergence
          - breakout
          - ema_basic

# Serialise runs — prevents duplicate signals and race conditions on the trade log.
concurrency:
  group: signal-bot
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: read
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Read strategy from config.json or manual override
        id: strategy
        run: |
          MANUAL="${{ github.event.inputs.strategy }}"
          if [ -n "$MANUAL" ]; then
            echo "strategy=$MANUAL" >> $GITHUB_OUTPUT
            echo "Source: manual override — $MANUAL"
          elif [ -f config.json ]; then
            AUTO=$(python3 -c "import json; print(json.load(open('config.json'))['strategy'])")
            echo "strategy=$AUTO" >> $GITHUB_OUTPUT
            echo "Source: config.json — $AUTO"
          else
            echo "strategy=bollinger" >> $GITHUB_OUTPUT
            echo "Source: default — bollinger"
          fi

      - name: Set artifact and log file names
        id: names
        run: |
          STRATEGY="${{ steps.strategy.outputs.strategy }}"
          # Artifact name uses hyphens (GitHub artifact naming)
          ARTIFACT="trade-log-${STRATEGY//_/-}"
          # Log file name uses underscores (Python filename)
          LOGFILE="trade_log_${STRATEGY}.csv"
          echo "artifact=$ARTIFACT" >> $GITHUB_OUTPUT
          echo "logfile=$LOGFILE" >> $GITHUB_OUTPUT
          echo "Strategy: $STRATEGY | Artifact: $ARTIFACT | Log: $LOGFILE"

      - name: Download previous trade log for this strategy
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: signal_bot.yml
          name: ${{ steps.names.outputs.artifact }}
          path: .
          if_no_artifact_found: ignore
        continue-on-error: true

      - name: Run selected strategy
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          WEBHOOK_RELAY_URL: ${{ secrets.WEBHOOK_RELAY_URL }}
        run: |
          STRATEGY="${{ steps.strategy.outputs.strategy }}"
          echo "Run STRATEGY=\"$STRATEGY\""
          if [ "$STRATEGY" = "bollinger" ]; then
            python strategy_bollinger.py
          elif [ "$STRATEGY" = "ema_advanced" ]; then
            python strategy_ema_advanced.py
          elif [ "$STRATEGY" = "vwap" ]; then
            python strategy_vwap.py
          elif [ "$STRATEGY" = "rsi_divergence" ]; then
            python strategy_rsi_divergence.py
          elif [ "$STRATEGY" = "breakout" ]; then
            python strategy_breakout.py
          else
            python claude_signal_bot.py
          fi

      - name: Upload updated trade log
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: ${{ steps.names.outputs.logfile }}
          retention-days: 90
          overwrite: true
