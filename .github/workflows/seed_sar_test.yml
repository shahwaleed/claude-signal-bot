name: Seed SAR Test

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Create seeded trade log with fake SELL position for BTCUSDT
        run: |
          cat > trade_log_ema_advanced.csv << 'CSV_EOF'
          timestamp_dubai,symbol,price,signal,confidence,ema9_30m,ema21_30m,rsi7_30m,divergence,ema9_4h,ema21_4h,rsi7_4h,trend_4h,webhook_fired,reasoning
          2026-06-22 20:00:00,BTCUSDT,64000.0,SELL,95,63900.0,64100.0,80.0,none,63800.0,64200.0,78.0,bearish,True,SAR test: seeded fake SELL position
          CSV_EOF
          echo "Seeded CSV:"
          cat trade_log_ema_advanced.csv

      - name: Upload as trade-log-ema-advanced artifact
        uses: actions/upload-artifact@v4
        with:
          name: trade-log-ema-advanced
          path: trade_log_ema_advanced.csv
          retention-days: 90
          overwrite: true
