name: Fetch Backtest Data

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch OHLC data using /ohlc endpoint (days=365)
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import requests, json, time, datetime, os

          API_KEY = os.environ.get("COINGECKO_API_KEY", "")
          headers = {"x-cg-demo-api-key": API_KEY} if API_KEY else {}

          COINS = {
              "BTCUSDT": "bitcoin",
              "ETHUSDT": "ethereum",
              "SOLUSDT": "solana",
              "XRPUSDT": "ripple",
          }

          # CoinGecko /ohlc with days=365 returns ~365 daily candles
          # We call it once to get the last year of data
          # Note: free tier supports days=1,7,14,30,90,180,365 only
          ohlc_data = {}
          for symbol, coin_id in COINS.items():
              print(f"Fetching {symbol} ({coin_id}) -- days=365...")
              r = requests.get(
                  f"https://api.coingecko.com/api/v3/coins/{coin_id}/ohlc",
                  params={"vs_currency": "usd", "days": "365"},
                  headers=headers,
                  timeout=30
              )
              print(f"  Status: {r.status_code}")
              r.raise_for_status()
              candles = []
              seen_dates = set()
              for c in r.json():
                  dt = datetime.datetime.fromtimestamp(c[0]/1000, tz=datetime.timezone.utc)
                  date_str = dt.strftime("%Y-%m-%d")
                  if date_str not in seen_dates:
                      seen_dates.add(date_str)
                      candles.append({
                          "date": date_str,
                          "ts": c[0],
                          "open": float(c[1]),
                          "high": float(c[2]),
                          "low": float(c[3]),
                          "close": float(c[4])
                      })
              candles.sort(key=lambda x: x["ts"])
              ohlc_data[symbol] = candles
              print(f"  {len(candles)} daily candles: {candles[0]['date']} -> {candles[-1]['date']}")
              time.sleep(4)

          output = {
              "fetched_at": datetime.datetime.utcnow().isoformat() + "Z",
              "description": "~365 days daily OHLC for BTC/ETH/SOL/XRP from CoinGecko /ohlc endpoint",
              "ohlc": ohlc_data
          }

          os.makedirs("backtest", exist_ok=True)
          with open("backtest/price_data.json", "w") as f:
              json.dump(output, f)

          size_kb = os.path.getsize("backtest/price_data.json") / 1024
          print(f"\nWritten backtest/price_data.json ({size_kb:.1f} KB)")
          total_candles = sum(len(v) for v in ohlc_data.values())
          print(f"Total candles across all assets: {total_candles}")
          PYEOF

      - name: Commit data to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest/price_data.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Add backtest price data (~365 days daily OHLC for BTC/ETH/SOL/XRP)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
