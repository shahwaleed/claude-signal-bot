name: Fetch Backtest Data

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch 2 years of daily OHLC from Binance public API
        run: |
          python3 << 'PYEOF'
          import requests, json, time, datetime, os

          # Binance public klines API - no auth required
          # Endpoint: GET /api/v3/klines
          # Interval: 1d (daily)
          # limit: 1000 max per call (1000 days > 2 years)
          BASE = "https://api.binance.com"
          SYMBOLS = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT"]

          # 2 years ago in milliseconds
          end_ms = int(datetime.datetime.now().timestamp() * 1000)
          start_ms = end_ms - (2 * 365 * 24 * 3600 * 1000)

          ohlc_data = {}
          for symbol in SYMBOLS:
              print(f"Fetching {symbol} daily candles...")
              r = requests.get(
                  f"{BASE}/api/v3/klines",
                  params={
                      "symbol": symbol,
                      "interval": "1d",
                      "startTime": start_ms,
                      "endTime": end_ms,
                      "limit": 1000
                  },
                  timeout=30
              )
              print(f"  Status: {r.status_code}")
              r.raise_for_status()
              raw = r.json()

              candles = []
              for c in raw:
                  # Binance kline format:
                  # [open_time, open, high, low, close, volume, close_time, ...]
                  dt = datetime.datetime.fromtimestamp(c[0]/1000, tz=datetime.timezone.utc)
                  candles.append({
                      "date": dt.strftime("%Y-%m-%d"),
                      "ts": c[0],
                      "open": float(c[1]),
                      "high": float(c[2]),
                      "low": float(c[3]),
                      "close": float(c[4]),
                      "volume": float(c[5])
                  })

              ohlc_data[symbol] = candles
              print(f"  {len(candles)} daily candles: {candles[0]['date']} -> {candles[-1]['date']}")
              time.sleep(1)

          output = {
              "fetched_at": datetime.datetime.utcnow().isoformat() + "Z",
              "description": "2-year daily OHLC from Binance public API (no auth)",
              "source": "Binance /api/v3/klines interval=1d",
              "ohlc": ohlc_data
          }

          os.makedirs("backtest", exist_ok=True)
          with open("backtest/price_data.json", "w") as f:
              json.dump(output, f)

          size_kb = os.path.getsize("backtest/price_data.json") / 1024
          total = sum(len(v) for v in ohlc_data.values())
          print(f"\nWritten backtest/price_data.json ({size_kb:.0f} KB, {total} total candles)")
          PYEOF

      - name: Commit data to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest/price_data.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Add 2-year backtest price data (Binance daily OHLC, BTC/ETH/SOL/XRP)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
