name: Market Analyzer

on:
  workflow_dispatch:

# Serialise runs — prevents two analyzer runs writing config.json simultaneously,
# and prevents an analyzer run from writing config.json while signal_bot is reading it.
concurrency:
  group: market-analyzer
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: read
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run market analyzer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python market_analyzer.py

      - name: Upload strategy log
        uses: actions/upload-artifact@v4
        with:
          name: strategy-log
          path: strategy_log.csv
          retention-days: 90
          overwrite: true
