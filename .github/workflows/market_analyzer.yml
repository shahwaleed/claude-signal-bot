name: Market Analyzer

on:
  schedule:
    - cron: '0 2 * * *'    # 6:00 AM Dubai (UTC+4) — before Asia close
    - cron: '30 6 * * *'   # 10:30 AM Dubai (UTC+4) — before London open
    - cron: '30 11 * * *'  # 3:30 PM Dubai (UTC+4) — before NY open (most important)
    - cron: '0 19 * * *'   # 11:00 PM Dubai (UTC+4) — end of NY session
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: read
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Download previous strategy log
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: market_analyzer.yml
          name: strategy-log
          path: .
          if_no_artifact_found: ignore
        continue-on-error: true

      - name: Run market analyzer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: python market_analyzer.py

      - name: Upload strategy log
        uses: actions/upload-artifact@v4
        with:
          name: strategy-log
          path: strategy_log.csv
          retention-days: 90
          overwrite: true
