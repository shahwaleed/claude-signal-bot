name: Market Analyzer

on:
  workflow_dispatch:

# Serialise runs — prevents two analyzer runs writing config.json simultaneously,
# and prevents an analyzer run from writing config.json while signal_bot is reading it.
concurrency:
  group: market-analyzer
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: read
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run market analyzer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python market_analyzer.py

      - name: Commit analyzer summary to repo
        if: always()
        run: |
          if [ ! -f analyzer_summary.json ]; then
            echo "analyzer_summary.json not found — skipping."
            exit 0
          fi
          TIMESTAMP=$(date -u +"%Y-%m-%d_%H-%M")
          SUMMARY_DEST="run_summaries/${TIMESTAMP}_analyzer.json"
          mkdir -p run_summaries
          cp analyzer_summary.json "$SUMMARY_DEST"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add "$SUMMARY_DEST"
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Analyzer summary: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload strategy log
        uses: actions/upload-artifact@v4
        with:
          name: strategy-log
          path: strategy_log.csv
          retention-days: 90
          overwrite: true
